<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Arthur's Office - 3D prototype</title>
    <style>
      html, body { margin: 0; height: 100%; background: #05060a; overflow: hidden; }
      body { display: grid; place-items: center; font: 12px/1.5 ui-monospace, monospace; color: #6b7a8c; }
      /* The renderer draws at 640x400; the browser scales it up with no
         smoothing, which is what keeps the pixel grain of the 2D game. */
      #view canvas {
        width: min(96vw, 1280px);
        height: auto;
        image-rendering: pixelated;
        display: block;
        box-shadow: 0 0 80px #0d1730;
      }
      p { margin: 10px 0 0; letter-spacing: 0.04em; }
    </style>
  </head>
  <body>
    <div>
      <div id="view"></div>
      <p>Click the floor to walk. No occluder polygons - the desk hides him because it is in front of him.</p>
    </div>
    <script type="module" src="/src/proto/office3d.ts"></script>
  </body>
</html>
